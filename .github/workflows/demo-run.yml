# Demo run: starts the system on an empty database with the web client, runs the scenario of the
# presentation (demo data, invoice, payment, credit note) and takes screenshots of the main screens and
# the printed documents. The results are in the artifact "demo-run".
name: Demo run

on:
  push:
    branches: ['**']
    paths: ['ci/**', '.github/workflows/demo-run.yml']
  workflow_run:
    workflows: ['Web client']
    types: [completed]
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: |
          mvn -B -ntp package -DskipTests
          mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=cp.txt -Dmdep.includeScope=test

      - name: Start the server (with the test module)
        run: |
          jar=$(ls target/*.jar | grep -v -- '-sources' | head -1)
          java -Ddb.server=localhost -Ddb.user=postgres -Ddb.password=ci-password -Ddb.name=kaif \
               -Dlogics.topModule=KaifDemoTest -Duser.setLanguage=ar -Duser.setCountry=SA -Duser.setTimezone=Asia/Riyadh \
               -cp "ci:$jar:$(cat cp.txt)" lsfusion.server.logics.BusinessLogicsBootstrap > server.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "Server has successfully started" server.log; then break; fi
            if grep -q "Error starting server" server.log; then break; fi
            sleep 5
          done
          grep -E "ERROR|successfully started|Kaif:" server.log | head -50
          grep -q "Server has successfully started" server.log

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the web client
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          image=ghcr.io/$owner/kaif:client
          docker pull $image || image=lsfusion/client:7.0-SNAPSHOT
          echo "Client image: $image"
          docker run -d --name client --network host -e APP_SERVER=localhost $image
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/login && break
            sleep 5
          done
          curl -s -o /dev/null -w "login page: %{http_code}\n" http://localhost:8080/login

      - name: Scenario (demo data, invoice, payment, credit note)
        run: |
          mkdir -p out
          curl -sS -u admin: -X POST "http://localhost:8080/exec?action=KaifTest.runDemo" -o out/scenario.json -w "%{http_code}\n"
          cat out/scenario.json; echo
          curl -sS -u admin: -X POST "http://localhost:8080/exec?action=KaifTest.invoicePdf" -o out/invoice.pdf -w "%{http_code}\n"
          curl -sS -u admin: -X POST "http://localhost:8080/exec?action=KaifTest.receiptPdf" -o out/receipt.pdf -w "%{http_code}\n"
          curl -sS -u admin: -X POST "http://localhost:8080/exec?action=KaifTest.creditNotePdf" -o out/credit-note.pdf -w "%{http_code}\n"
          sudo apt-get install -y -qq poppler-utils > /dev/null
          for f in out/*.pdf; do pdftoppm -png -r 80 -f 1 -l 1 "$f" "${f%.pdf}" || head -c 600 "$f"; done
          ls -la out
          grep -q '"invoice"' out/scenario.json

      - name: Screenshots
        run: |
          cd ci/demo
          npm init -y > /dev/null
          npm install --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          OUT=$GITHUB_WORKSPACE/out/screens node shots.js

      - name: Logs
        if: always()
        run: |
          cp server.log out/ || true
          docker logs client > out/client.log 2>&1 || true
          grep -E "ERROR|Exception" server.log | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-run
          path: out
          retention-days: 14
